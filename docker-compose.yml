services:
  api:
    build: ./backend
    container_name: breachwright-api
    ports:
      - "13370:13370"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-breachwright}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-breachwright}
      - DATA_DIR=/app/data
      - DESKTOP=false
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: breachwright-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-breachwright}
      POSTGRES_USER: ${POSTGRES_USER:-breachwright}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-breachwright}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: breachwright-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
