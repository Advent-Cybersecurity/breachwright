name: Candidate Build

on:
  workflow_dispatch:
  push:
    branches: ["codex/breachwright-2.1-foundation"]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: e8ee105bbce544f1ce735e26860ae60c0c0c688e
          path: .upgrade-baseline
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            xvfb
      - name: Install backend and build dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Verify v2.0 data upgrade
        run: python scripts/smoke_upgrade.py .upgrade-baseline
      - name: Build and smoke-test candidate
        run: python build.py --clean
      - name: Smoke-test Windows desktop window
        if: runner.os == 'Windows'
        run: python scripts/smoke_desktop.py dist/Breachwright/Breachwright.exe
      - name: Smoke-test Linux desktop window
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_desktop.py dist/Breachwright/Breachwright
      - name: Confirm candidate archive exists
        shell: bash
        run: test -n "$(find dist -maxdepth 1 -type f -name 'breachwright-*' -print -quit)"
