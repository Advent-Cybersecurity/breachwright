name: Candidate Build

on:
  workflow_dispatch:
    inputs:
      retain_release_artifacts:
        description: Retain exact tested archives for an approved release
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: candidate-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build and smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: e8ee105bbce544f1ce735e26860ae60c0c0c688e
          path: .upgrade-baseline
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt
            tests/requirements-v2-upgrade.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o DPkg::Lock::Timeout=60 install -y \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            xvfb
      - name: Install backend and build dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-build.txt
      - name: Verify v2.0 data upgrade
        run: |
          python -m pip install -r tests/requirements-v2-upgrade.txt
          python scripts/smoke_upgrade.py .upgrade-baseline
          python -m pip uninstall -y PyJWT passlib bcrypt
      - name: Build and smoke-test candidate
        run: python build.py --clean
      - name: Smoke-test Windows desktop window
        if: runner.os == 'Windows'
        run: python scripts/smoke_desktop.py dist/Breachwright/Breachwright.exe
      - name: Smoke-test Windows marked download
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_windows_motw.ps1 dist/Breachwright
      - name: Smoke-test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_install_windows.ps1 dist/Breachwright
      - name: Smoke-test Linux desktop window
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/smoke_desktop.py dist/Breachwright/Breachwright
      - name: Smoke-test Linux install and uninstall
        if: runner.os == 'Linux'
        run: bash scripts/smoke_install_linux.sh dist/Breachwright
      - name: Verify candidate release archive
        run: python scripts/verify_archive.py dist
      - name: Retain approved release archive
        if: github.event_name == 'workflow_dispatch' && inputs.retain_release_artifacts
        uses: actions/upload-artifact@v6
        with:
          name: breachwright-${{ runner.os }}-${{ github.sha }}
          path: dist/breachwright-*
          if-no-files-found: error
          retention-days: 1
